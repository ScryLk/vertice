[package]
name = "vertice-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# A seta aponta para dentro: o servidor conhece o motor, o motor não conhece
# o servidor. `vertice-core` continua com zero dependências.
vertice-core = { path = "../vertice-core" }
vertice-bot = { path = "../vertice-bot" }
vertice-protocol = { path = "../vertice-protocol" }

# `serde` existe só aqui. O motor nunca aprende a virar bytes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "fs"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# Cliente WebSocket headless do teste de reconexão. Ele fala o protocolo como
# um cliente de verdade falaria — nada de atalho pelo lado de dentro.
tokio-tungstenite = "0.30"

[package]
name = "vertice-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# A seta aponta para dentro: o servidor conhece o motor, o motor não conhece
# o servidor. `vertice-core` continua com zero dependências.
vertice-core = { path = "../vertice-core" }

# `serde` existe só aqui. O motor nunca aprende a virar bytes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
